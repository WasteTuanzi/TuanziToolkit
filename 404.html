<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>重定向中...</title>
    <script>
        // 获取当前路径（不包括域名）
        const path = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;

        // 重定向到 index.html 并保持路径
        const redirectUrl = '/index.html' + (path !== '/' ? '?redirect=' + encodeURIComponent(path + search + hash) : '');

        // 立即重定向
        window.location.replace(redirectUrl);
    </script>
</head>
<body>
<p>正在重定向到应用...</p>
</body>
</html>
